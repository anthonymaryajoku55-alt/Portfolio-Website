<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atra login page</title>
    <link rel="stylesheet" href="web-log.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 class="fs-2 text-center fw-bold">Astra Notes</h1>
    <p class="fs-4 fw-bold text-center my-3">Capture every idea. Ship with clarity.</p>
    <div class="container-fluid">
    <div class="row d-flex justify-content-center ">
    <div class="col-6 col-sm-6 col-md-6 col-lg-6">
      <form action="">
        <fieldset class="border p-3 m-1">
            <legend class="text-center p-2">LOGIN</legend>
            <div class="form-group d-flex gap-2">
            <label for="name" class="form-label">Username</label>
            <input type="text" id="name" class=" form-control mb-2 text-center" placeholder="input username">
            </div>
            <div class="d-flex gap-2 form-group my-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control mb-2 text-center" placeholder="Input password">
            </div>
            <div class="btn-grp d-flex justify-content-center gap-4">
                <button type="submit" class="btn btn-primary rounded-pill">submit</button>
                <button type="reset" class="btn btn-dark rounded-pill">reset</button>
            </div>
            <a class="text-center link" href="/Portfolio Website/Bootstrap Folder/web-reg.html">dont have an account? sign in</a>
        </fieldset>
      </form>
      </div>  
    </div>
    </div>
</body>
